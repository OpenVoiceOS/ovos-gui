[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-gui"
dynamic = ["version"]
description = "ovos-core gui service daemon"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["ovos", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "ovos_bus_client>=2.2.0a1,<3.0.0",
    "ovos-spec-tools>=0.9.0a1",
    "ovos-utils>=0.0.37,<1.0.0",
    "ovos-config>=0.0.12,<3.0.0",
    "tornado~=6.0, >=6.0.3",
    # >=2.5.0a1 carries OVOSGUIAdapterFactory (the opm.gui_adapter loader).
    "ovos-plugin-manager>=2.5.0a1,<3.0.0",
]

[project.optional-dependencies]
# Bundled Qt adapter. ovos-gui itself runs no display backend; install an
# opm.gui_adapter plugin to render. Headless installs need none of these.
gui = ["ovos-legacy-mycroft-gui-plugin>=0.0.1,<1.0.0"]
test = [
    "pytest~=7.1",
    "pytest-cov~=4.1",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-gui"

[project.scripts]
ovos-gui-service = "ovos_gui.__main__:main"
ovos-gui-debug-tui = "ovos_gui.tui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_gui*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_gui.version.__version__"}
